[project]
name = "counterforge-meta"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "counterforge-contracts",
    "httpx>=0.28,<1",
    "meta-sam-parser==0.1.0",
    "openai>=2,<3",
    "pillow>=12,<14",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterforge_meta"]

[tool.uv.sources]
counterforge-contracts = { workspace = true }
