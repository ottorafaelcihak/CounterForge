[project]
name = "counterforge-verification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Pinned exactly: the independent verifier recomputes rasters and must not
# silently decode or re-encode with a different Pillow build than the generator.
dependencies = ["counterforge-contracts", "counterforge-mutations", "pillow==13.0.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterforge_verification"]

[tool.uv.sources]
counterforge-contracts = { workspace = true }
counterforge-mutations = { workspace = true }
