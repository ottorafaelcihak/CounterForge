[project]
name = "counterforge-mutations"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Pinned exactly: recipes record the Pillow build, and raster replay/geometry
# recomputation must stay reproducible against the same rasterizer.
dependencies = ["counterforge-contracts", "pillow==13.0.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterforge_mutations"]

[tool.uv.sources]
counterforge-contracts = { workspace = true }
