[project]
name = "counterforge-mutations"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["counterforge-contracts"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterforge_mutations"]

[tool.uv.sources]
counterforge-contracts = { workspace = true }
