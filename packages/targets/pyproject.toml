[project]
name = "counterforge-targets"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["counterforge-contracts", "counterforge-verification", "counterforge-meta"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterforge_targets"]

[tool.uv.sources]
counterforge-contracts = { workspace = true }
counterforge-verification = { workspace = true }
counterforge-meta = { workspace = true }
