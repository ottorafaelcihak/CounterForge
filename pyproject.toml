[project]
name = "counterforge-workspace"
version = "0.1.0"
description = "Verified visual regression experiments — foundation workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "counterforge-contracts", "counterforge-meta", "counterforge-mutations",
  "counterforge-verification", "counterforge-targets", "counterforge-regression",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-socket>=0.7,<1", "httpx2>=2.16,<3", "jsonschema>=4,<5", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
counterforge-contracts = { workspace = true }
counterforge-meta = { workspace = true }
counterforge-mutations = { workspace = true }
counterforge-verification = { workspace = true }
counterforge-targets = { workspace = true }
counterforge-regression = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "node_modules", ".codex-attachments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "services", "scripts", "tests/contracts/test_provider_protocols.py"]
exclude = ["__pycache__"]
plugins = ["pydantic.mypy"]
