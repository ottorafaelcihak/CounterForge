x-runtime: &runtime
  environment: &runtime-environment
    APP_ENV: ${APP_ENV:-development}
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: counterforge
    PGUSER: counterforge
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting services}
    REDIS_URL: redis://redis:6379/0
    ARTIFACT_ROOT: /data/artifacts
    PRICING_PATH: /app/pricing.toml
    PROVIDER_MODE: ${PROVIDER_MODE:-DISABLED}
    ALLOW_SYNTHETIC_FIXTURES: ${ALLOW_SYNTHETIC_FIXTURES:-0}
    RUN_META_LIVE_TESTS: ${RUN_META_LIVE_TESTS:-0}
    MODEL_API_KEY: ${MODEL_API_KEY:-}
    ENQUEUE_JOBS: "1"
    QUEUE_NAME: ${QUEUE_NAME:-counterforge}
    MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-100}
    MAX_CONCURRENT_PROVIDER_CALLS: "1"
    OWNER_AUTH_TOKEN: ${OWNER_AUTH_TOKEN:?Set OWNER_AUTH_TOKEN before starting services}
    OWNER_LABEL: ${OWNER_LABEL:-local-owner}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  volumes:
    - artifacts:/data/artifacts

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: counterforge
      POSTGRES_USER: counterforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting services}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counterforge -d counterforge"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *runtime
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "services.api.app.db.migrations"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *runtime
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *runtime
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      OWNER_AUTH_TOKEN: ${OWNER_AUTH_TOKEN:?Set OWNER_AUTH_TOKEN before starting services}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata: {}
  redisdata: {}
  artifacts: {}
